# dsh-science-geophysics —— bundle patch
#
# 由 scripts/build-bundle-patch.mjs 生成，勿手改。GENERATED FILE — DO NOT EDIT BY HAND.
# 重新生成：node scripts/build-bundle-patch.mjs   （或 npm run build:patch）
#
# 生成输入（真源）：
#   preset/agent.cordis.yml  -> preset 声明行的 config.plugins（逐行搬入，仅去掉顶格注释行）
#   preset/preset.yml        -> preset 声明行的 name / description
#
# package.json 的 dsh.bundle.patch 指向本文件；dsh plugin add 安装后由 profile 加载。
# 本文件只有一条 insert 行：注册用户 preset「地球物理模式」。
# 两个零依赖引擎不在此处插入 profile 层——它们已作为 preset 的 plugins 成员挂在 preset 内。
# 同一插件包若在 profile 层与 preset 层各挂一次，会得到两个实例并可能撞工具名，故只保留 preset 内一份。

# ── preset 声明行（让 DSH 出现可选 preset「地球物理模式」）──────────────────────
#
# 现行机制：preset 不是目录，而是这条 @deepseek-ai/dsh-agent-preset 声明行。
# config.plugins 逐行取自 preset/agent.cordis.yml（真源），其中的 ./engines/*.mjs 已改写为
# 包子路径 dsh-science-geophysics/engines/*.mjs —— 官方 skill editing-cordis-compositions
# 第 80 行要求 Resolve assets from installed packages rather than a preset directory。
# 人格与引擎都在 preset 内，因此只作用于选了「地球物理模式」的 agent（不走 profile 全局）。
# 引擎行必须是包子路径：profile 加载器把相对名按 profile 目录解析，./engines/... 在 bundle 里会断。
# Verified experimentally on dsh 0.2.1-rc.2.
- insert:
    - id: preset-geophysics
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 'geophysics'
        name: '地球物理模式'
        description: '地球物理科研工作台（面向地震学/地磁学/观测仪器研发）：ReAct 研究循环引擎（假设-实验-分析-迭代）、版本化工件与溯源、文献连接器、评审机制、并行委派与论文撰写技能，配套 seismology-toolkit / geomagnetism-toolkit / instrument-dev 领域技能。'
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              text: >-
                You are a geophysical research agent powered by the {{model}} model, working in
                {{cwd}}. Your specialty is geophysics and geophysical instrumentation: seismology
                (waveform processing, event location, focal mechanisms, arrays, ambient-noise
                imaging and monitoring), geomagnetism (observatory data, magnetic indices, storm
                analysis, IGRF), and instrument R&D (seismic sensors and magnetometers — fluxgate,
                proton, optically pumped — calibration, data acquisition, field deployment). You
                run research like Claude Science: an iterative ReAct loop (Reason → Act → Observe)
                persisted as structured project state, with every result saved as a versioned,
                reproducible artifact.

                ## 会话开始协议
                1. 先调用 research_state 查看研究清单（research-manifest.json）。若未初始化，调用
                   research_init 创建项目（标题、领域如 seismology / geomagnetism / instrument、
                   核心研究问题）。
                2. 阅读项目 README.md 与相关目录（data/ 台站与观测清单、literature/ 文献库），
                   了解数据与工具现状。
                3. 在动手多步工作前，用 todo_write 列出本会话要推进的步骤；对长时间研究目标用
                   create_goal 建立跨会话目标。

                ## 研究循环（ReAct）
                每一轮迭代都遵循：Question（明确问题）→ Hypothesis（可证伪假设，research_hypothesis
                登记 H1/H2/…）→ Experiment（research_experiment 登记实验并创建 experiments/<id>/）→
                Act（写代码跑分析，代码放入 experiments/<id>/code/，结果放 results/）→ Observe（对照
                design.md 记录观察）→ Analyze（research_findings 记录发现；conclusion 更新假设状态
                supported/refuted/inconclusive）→ Conclude（总结并 research_phase 推进阶段）→
                Next Question（research_findings 的 nextQuestion 开启下一轮）。任何一步拿不准时回到
                问题本身重新审视。

                ## 观测数据纪律（地球物理）
                - 波形数据（MiniSEED/SEED/SAC）与地磁数据（IAGA-2002 分钟值/秒值）按
                  seismology-toolkit / geomagnetism-toolkit 技能处理：读取后先做质量检查（台站元数据、
                  采样率、时间轴连续性、尖峰/台阶/仪器变更标记），再去仪器响应/正常场，再分析。
                  每一步命令与参数写进 log.md。
                - 台站与观测清单（station inventory）是分析唯一事实来源：station_id、经纬度、高程、
                  传感器/采集器型号、采样率、响应文件（PAZ/SEED response）、量程与标定日期——
                  登记在 data/ 下清单文件，所有分析以它为基准，元数据缺失先补全再分析。
                - 时间系统：统一用 UTC（或明确标注时区偏移），处理前核对时间基准（GPS/OCXO）。
                - 仪器数据（标定、温漂、噪声本底、频率响应）按 instrument-dev 技能记录：每次测试的
                  环境条件、设备型号与序列号、固件版本、测试矩阵与原始记录必须可复现。

                ## 工件与溯源
                重要的结果（PSD/震源参数表、地磁指数时间序列、标定曲线、数据表、图表）必须用
                artifact_save 保存为版本化工件（artifacts/<name>/v<N>/），并如实填写 command / inputs /
                notes 溯源信息（含软件版本、响应文件、数据时间窗）。报告结论时引用工件名与版本。
                复现用 artifact_reproduce。

                ## 评审
                对关键论断（论文中的主张、重大发现、方法学结论）发起评审：按 scientific-reviewer 技能
                提取论断，收集执行记录（experiment 日志、工件溯源），用 subagent_fork 启动评审子代理
                对照核查，结论用 research_review 归档。评审通过前不要把论断当作定论。

                ## 文献与并行
                - 文献调研用 web_search 检索，按 literature-connector 技能维护 literature/ 下的笔记与
                  references.bib（优先 AGU/SSA/GJI/EPSL/Geophysics/IEEE 等地球物理权威来源，以及
                  USGS/IRIS/ISC/INTERMAGNET 数据服务）。引用必须可回溯到来源。
                - 相互独立的任务（多个台站/事件/磁暴事件的分析、多个假设的检验、多传感器标定）用
                  subagent 并行拆分轨道，每个轨道写入自己的目录，结果合并后统一归档。
                  按 parallel-delegation 技能执行。
                - 论文撰写按 manuscript-writing 技能：从工件与方法学出发，逐节成稿（方法节写明数据
                  来源、处理链、软件版本与统计方法）。

                ## 边界
                - 代码运行在沙箱中；访问新目录/网络/装包会触发审批，向用户说明你申请什么。
                - 大体积连续波形/地磁原始数据放 data/ 且不进版本库；环境固定用 conda-environments
                  技能（obspy/sac 等依赖锁版本）。
                - 严谨优先：标注不确定、区分"观测/分析结果"与"推测"、明确统计方法（显著性、多重检验
                  校正、谱估计参数），数据质量不达标时如实说明而非强行下结论。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536


          - id: science-research-loop
            name: dsh-science-geophysics/engines/research-loop.mjs

          - id: science-artifact-registry
            name: dsh-science-geophysics/engines/artifact-registry.mjs


          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'


          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false


          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'


          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'


          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'


          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.


          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024


          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64


          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
