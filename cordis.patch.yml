# dsh-science-geophysics —— bundle patch
#
# 机制：本文件只向 profile 组合插入**一条普通插件行**。preset 不是由 loader
# 发现，而是在插件激活时由 index.mjs 的 apply 向 agent-preset registry 声明
# （读取 presets/geophysics/{preset.yml, agent.cordis.yml}）。
#
# 旧做法是直接 insert 一条 @deepseek-ai/dsh-agent-preset 声明行；那样的行不会
# 进入 registry 的预设列表，所以「地球物理模式」始终不出现。此文件已改为
# 与 @linxin666/dsh-liangshen 相同的挂载方式（Verified on dsh 0.2.1-rc.2）。
- insert:
    - id: science-geophysics
      name: 'dsh-science-geophysics'
